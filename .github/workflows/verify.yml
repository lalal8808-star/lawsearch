name: Verify

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          GOOGLE_API_KEY: test-only-key
          SECRET_KEY: integration-test-secret-key-that-is-long-enough
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ""
      - run: python -m py_compile database.py main.py engine/rag.py services/reporting.py services/knowledge_sync.py services/retrieval.py
      # 테스트는 SQLite로 돌기 때문에 운영(PostgreSQL) 드라이버 누락을 잡지 못한다.
      # 운영과 같은 postgresql:// URL로 엔진을 만들어 드라이버가 실제로 로드되는지 확인한다(접속은 하지 않음).
      - run: python -c "from sqlalchemy import create_engine; create_engine('postgresql://u:p@localhost:5432/db')"
